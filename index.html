<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./favicon.png?v=2" />

  <!-- Fallback SEO Title (overridden per-page by React SEO component) -->
  <title>Managed Cybersecurity & 24/7 SOC Services | Oberon Services</title>

  <!-- Base SEO Meta (overridden per-page by React SEO component) -->
  <meta name="description" content="Oberon Services is a leading Managed Security Service Provider (MSSP). We offer 24/7 Managed SOC, threat detection, compliance gap analysis, private AI, and cyber readiness training." />
  <link rel="canonical" href="https://www.oberon-services.com/" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#020617" />
  <meta name="author" content="Oberon Services Security Team" />

  <!-- Open Graph Base (overridden per-page) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Oberon Services" />
  <meta property="og:image" content="https://www.oberon-services.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card Base (overridden per-page) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@OberonSecurity" />

  <!-- Performance: Preconnect to critical third-party origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />
  <link rel="dns-prefetch" href="https://grainy-gradients.vercel.app" />

  <!-- Structured Data: Base Corporate Schemas (Organization, LocalBusiness, ContactPoint) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.oberon-services.com/#organization",
          "name": "Oberon Services",
          "alternateName": "Oberon Security",
          "url": "https://www.oberon-services.com",
          "logo": "https://www.oberon-services.com/logo-dark.png",
          "email": "security@oberon-services.com",
          "telephone": "+880-1720-596676",
          "sameAs": [
            "https://www.linkedin.com/company/oberon-services-ltd/",
            "https://www.facebook.com/profile.php?id=61587299814352"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "telephone": "+880-1720-596676",
            "email": "security@oberon-services.com",
            "availableLanguage": "English",
            "hoursAvailable": "Mo-Su 00:00-24:00"
          }
        },
        {
          "@type": "LocalBusiness",
          "@id": "https://www.oberon-services.com/#localbusiness",
          "name": "Oberon Services",
          "image": "https://www.oberon-services.com/logo-dark.png",
          "url": "https://www.oberon-services.com",
          "telephone": "+880-1720-596676",
          "email": "security@oberon-services.com",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "House # 31, Road # 02, Block-E, Banasree",
            "addressLocality": "Dhaka",
            "postalCode": "1219",
            "addressCountry": "BD"
          },
          "openingHoursSpecification": {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday"
            ],
            "opens": "00:00",
            "closes": "23:59"
          }
        }
      ]
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#020617', // Slate 950 - Darker background
              light: '#f8fafc', // Slate 50
              accent: 'rgb(var(--color-brand-accent) / <alpha-value>)', // Dynamic Accent
              secondary: '#3b82f6', // Blue 500
              success: '#10b981', // Emerald 500
              card: '#0f172a', // Slate 900 for cards
              'card-hover': '#1e293b', // Slate 800 for hover
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Rajdhani', 'sans-serif'], // Futuristic, squared headers
          },
          animation: {
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* Light Mode Accent: Darker Cyan (Cyan-600) */
      /* Retains the cyan identity but is readable on white backgrounds */
      --color-brand-accent: 8 145 178;
      /* #0891b2 */
    }

    .dark {
      /* Dark Mode Accent: Neon Cyan (Cyan-500) */
      --color-brand-accent: 6 182 212;
      /* #06b6d4 */
    }

    body {
      font-family: 'Inter', sans-serif;
      /* Set base backgrounds here so transparent page containers show this */
      background-color: #f8fafc;
      /* Slate 50 */
    }

    .dark body {
      background-color: #020617;
      /* Slate 950 */
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #020617;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>

<body class="text-slate-900 dark:text-slate-200 transition-colors duration-300">
  <div id="root">
    <!-- Static Fallback for SEO Crawlers (will be replaced when React mounts) -->
    <header style="display:none;">
      <h1>Oberon Services - Managed Cybersecurity & 24/7 SOC Services</h1>
      <p>Protect your enterprise with Oberon's 24/7 Managed SOC, threat detection, compliance gap analysis, private AI, and cyber readiness training.</p>
    </header>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
